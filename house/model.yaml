# 514 Village Ct — source of truth for the house model.
# Cycle 1 precision: ±1 ft (assessor-sketch resolution). See CLAUDE.md "Precision is progressive".
#
# Every geometric entry carries:
#   prov: measured | imported | researched | inferred   (measured > imported > researched > inferred)
#   tol:  tolerance in feet for that entry's numbers
#   conf: (inferred only) high | medium | low
#   src:  short pointer to the evidence (research.md source letters: A, P, Z; "Jon <date>" = walkthrough answers)
#
# Coordinates:
#   origin = front-left exterior corner of the main section, at main-level finished floor
#   +x = along the front, toward the two-story stack (to the right when facing the house from the street)
#   +y = front → back
#   +z = up
#   Compass: the front faces SSE (see site.front_bearing_deg), so +y points NNW and +x points ENE.
# Rectangles are [x0, y0, x1, y1] in feet, exterior face of framing/siding unless noted.
# Where a stair rect overlaps a room rect, the stair wins (stairwells are cut out of rooms).

units: ft
schema_version: 1

defaults:
  exterior_wall_thickness: {value: 0.5, prov: inferred, conf: high, tol: 0.1, src: "2x4 + sheathing + hardboard siding"}
  interior_wall_thickness: {value: 0.375, prov: inferred, conf: high, tol: 0.1, src: "2x4 + 1/2in drywall both sides"}

levels:
  main:
    footprint: {rect: [0, 0, 18, 24], prov: imported, tol: 1, src: "P sketch L1B (18 x 24)"}
    floor_z: {value: 0, prov: inferred, conf: high, tol: 0, src: "datum"}
    ceiling_height: {value: 8, prov: inferred, conf: medium, tol: 0.5, src: "era norm, 8 ft"}
    description: "Two spaces: living room (front, front door) and kitchen/dining (back, sliders to patio)."
  upper:
    footprint: {rect: [18, -2, 38, 26], prov: imported, tol: 1, src: "P sketch: 20 x 26 + two 1 x 20 strips (overhang)"}
    floor_z: {value: 4.5, prov: inferred, conf: medium, tol: 0.5, src: "4-split half-flight ~7 risers"}
    ceiling_height: {value: 8, prov: inferred, conf: medium, tol: 0.5}
    description: "Center hall running +x from the stair; bath + main bedroom on the front, two bedrooms on the back."
  lower:
    footprint: {rect: [18, -1, 38, 25], prov: imported, tol: 1, src: "P sketch L1B east section (20 x 26)"}
    floor_z: {value: -4.0, prov: inferred, conf: medium, tol: 0.5, src: "4-split half-flight down"}
    ceiling_height: {value: 7.5, prov: inferred, conf: medium, tol: 0.5}
    description: "Family room with wood-burning fireplace + built-ins, ½ bath. Partly below grade. = assessor's 520 sf finished."
  basement:
    footprint: {rect: [0, 0, 18, 24], prov: inferred, conf: high, tol: 1, src: "under main; P basement 952 = 432 + 520"}
    floor_z: {value: -8.5, prov: inferred, conf: medium, tol: 0.5}
    ceiling_height: {value: 7.5, prov: inferred, conf: low, tol: 0.5}
    description: "Small finished bedroom (non-conforming) at the stair foot; unfinished L around it with laundry and a wall of shelves on the driveway (left, x=0) side."

# Room topology on main, upper and basement comes from Jon's walkthrough (2026-11-08): conf medium.
# Room sizes are still guesses that fit the footprint: tol 2 ft.
rooms:
  # main — "only two things on the level"
  - {id: living_room,     level: main,     rect: [0.5, 0.5, 17.5, 11],    prov: inferred, conf: medium, tol: 2, src: "Jon 2026-11-08: front door opens into it; Z2-3"}
  - {id: kitchen_dining,  level: main,     rect: [0.5, 11, 17.5, 23.5],   prov: inferred, conf: medium, tol: 2, src: "Jon 2026-11-08: kitchen opens to back via sliders; Z4-9"}
  # upper — climb heading +x; bath is the first door on the right (front wall); main bedroom shares a wall with it, front windows.
  # Back half per Jon's plan review 2026-11-08: the left half of the old bedroom_2 is not upper living space; bedroom_2 = right
  # half of old b2 + left half of old b3; bedroom_3 = right half of old b3 and runs forward into where the hall used to end.
  - {id: hall_upper,      level: upper,    parts: [[18.5, 11, 28, 14.5], [25.25, 14.5, 28, 18]], prov: inferred, conf: medium, tol: 2, src: "Jon 2026-11-08 plan review #2: hall runs +x then hooks north at its right end to bedroom_2; J IMG_2493"}
  - {id: bath_full,       level: upper,    rect: [18.5, -1.5, 24.5, 11],  prov: inferred, conf: medium, tol: 2, src: "Jon 2026-11-08: first door on right, on front wall; J IMG_2494 long narrow bath, tub at the far (front) end"}
  - {id: bedroom_main,    level: upper,    rect: [24.5, -1.5, 37.5, 11],  prov: inferred, conf: medium, tol: 2, src: "Jon 2026-11-08: largest; shares wall with bath; front windows; J IMG_2495-2496"}
  - {id: bedroom_2,       level: upper,    parts: [[23.25, 18, 28, 25.5], [28, 20, 37.5, 25.5]], prov: inferred, conf: low, tol: 2, src: "Jon 2026-11-08 plan reviews: right half of old b2 + back half of old b3, entered from the hall hook"}
  - {id: bedroom_3,       level: upper,    rect: [28, 11, 37.5, 20],      prov: inferred, conf: medium, tol: 2, src: "Jon 2026-11-08 plan review #2: rectangle behind the main bedroom, shares its north wall; J IMG_2497-2498 (one of b2/b3)"}
  # closets (closet_of: drawn inside the parent room, no overlap warning)
  - {id: closet_main,     level: upper,    rect: [29, 9, 36, 11],         closet_of: bedroom_main, prov: inferred, conf: medium, tol: 2, src: "Jon 2026-11-08: on the main bedroom's north wall, shared with bedroom_3; J IMG_2496"}
  - {id: closet_b3,       level: upper,    rect: [28, 15, 30.5, 20],      closet_of: bedroom_3,    prov: inferred, conf: low,    tol: 2, src: "J IMG_2498; position a guess"}
  - {id: closet_b2,       level: upper,    rect: [23.25, 14.5, 25.25, 18], closet_of: bedroom_2,   prov: inferred, conf: low,    tol: 2, src: "space left of the hall hook; opens north into bedroom_2; a guess"}
  # lower — "it's all one room" (Jon 2026-11-08); the louvered bifold in the family room is the half-bath door
  - {id: family_room,     level: lower,    parts: [[24, -0.5, 37.5, 6], [18.5, 6, 37.5, 24.5]], prov: inferred, conf: medium, tol: 2, src: "Jon 2026-11-08: one room, couch + TV; J IMG_2486-2487; fireplace + built-ins"}
  - {id: bath_half,       level: lower,    rect: [18.5, -0.5, 24, 6],     prov: inferred, conf: low,    tol: 2, src: "Jon 2026-11-08: off the family room via louvered bifold; J IMG_2484-2485; position still a guess"}
  # basement — bedroom immediately right at the stair foot; unfinished L around it
  - {id: bedroom_4,       level: basement, rect: [5, 15, 17.5, 23.5],     prov: inferred, conf: medium, tol: 2, src: "Jon 2026-11-08: smallish, right of stair foot (non-conforming); J IMG_2480-2481"}
  - {id: unfinished,      level: basement, rect: [0.5, 0.5, 17.5, 23.5],  prov: inferred, conf: medium, tol: 2, src: "Jon 2026-11-08: L of unfinished: laundry + shelves along driveway (x=0) wall; J IMG_2482-2483", finished: false, note: "L-shaped: this rect minus bedroom_4 and stairs"}

# ---------- interior layer ----------
# Interior partitions as first-class objects so options can remove (`remove: true`) or add walls by id.
# from/to = wall centerline, axis-aligned. bearing = planning prior only: likely | unknown | unlikely | no.
# Anything not `no` needs licensed review before removal; bearing_basis says why and how to verify.
# doors: span along the wall's axis in model coords; kind door | bifold | bypass | cased (open, no door); rooms = which
# rooms' baseboard the opening interrupts.
walls:
  # main
  - id: w_main_center
    level: main
    from: [0.5, 11]
    to: [12, 11]
    bearing: likely
    bearing_basis: >-
      Sits on the house's mid-depth line. The basement duct trunk runs parallel to the front wall (J basement-from-bedroom
      photo), which usually tracks a center beam with joists spanning front-to-back. Verify in the unfinished basement: look
      for a steel/wood beam or post line under y ~ 11-12 and confirm joists run front-to-back.
    doors:
      - {id: d_living_to_stair_hall, span: [8.5, 12], kind: cased, rooms: [living_room, kitchen_dining]}
    prov: inferred
    conf: medium
    tol: 2
    src: "J IMG_2488 (wall with shelves between living room and kitchen; opening at right to the stairs)"
  - {id: w_main_stair_side, level: main, from: [12, 11], to: [18, 11], bearing: likely, bearing_basis: "same mid-depth line as w_main_center; also carries the upper stair stringer", prov: inferred, conf: medium, tol: 2, src: "J IMG_2493 wall on the right of the up-flight"}
  - {id: w_main_rail_down_stair, level: main, from: [12, 14.5], to: [12, 17.5], height: 3, bearing: "no", bearing_basis: "half wall with spindles (railing)", prov: imported, tol: 2, src: "J IMG_2490-2491"}
  - {id: w_main_rail_up_stair,   level: main, from: [12, 14.5], to: [18, 14.5], height: 3, bearing: "no", bearing_basis: "oak railing over the family room", prov: imported, tol: 2, src: "J IMG_2493"}
  # upper
  - id: w_up_center_front
    level: upper
    from: [18.5, 11]
    to: [37.5, 11]
    bearing: unknown
    bearing_basis: "mid-depth line of the upper level; may carry ceiling joists. Verify joist direction in the attic."
    doors:
      - {id: d_bath_full,    span: [19.5, 22], kind: door, rooms: [bath_full, hall_upper]}
      - {id: d_bedroom_main, span: [25, 27.5], kind: door, rooms: [bedroom_main, hall_upper]}
    prov: inferred
    conf: low
    tol: 2
    src: "Jon 2026-11-08 walkthrough"
  - {id: w_up_bath_main, level: upper, from: [24.5, -1.5], to: [24.5, 11], bearing: unlikely, bearing_basis: "parallel to likely joist span; verify in attic", prov: inferred, conf: low, tol: 2, src: "Jon 2026-11-08: main bedroom shares a wall with the bath"}
  # Hall runs +x from the stair, then hooks left (north) at its right end to bedroom_2's door (Jon 2026-11-08 review #2).
  - {id: w_up_hall_back, level: upper, from: [18.5, 14.5], to: [25.25, 14.5], bearing: unknown, bearing_basis: "parallel to the center line; verify in attic", prov: inferred, conf: low, tol: 2, src: "Jon 2026-11-08 plan review #2"}
  - {id: w_up_hook_left, level: upper, from: [25.25, 14.5], to: [25.25, 18], bearing: unlikely, bearing_basis: "hall hook / closet partition", prov: inferred, conf: low, tol: 2, src: "Jon 2026-11-08 plan review #2"}
  - id: w_up_b3_west
    level: upper
    from: [28, 11]
    to: [28, 20]
    bearing: unlikely
    bearing_basis: "bedroom_3's hall-side wall, parallel to likely joist span; verify in attic"
    doors:
      - {id: d_bedroom_3, span: [11.5, 14], kind: door, rooms: [bedroom_3, hall_upper]}
    prov: inferred
    conf: low
    tol: 2
    src: "Jon 2026-11-08 plan review #2: bedroom_3 is a rectangle behind the main bedroom"
  - id: w_up_hook_top
    level: upper
    from: [23.25, 18]
    to: [28, 18]
    bearing: unlikely
    bearing_basis: "bedroom_2's south wall at the hall hook"
    doors:
      - {id: d_closet_b2, span: [23.5, 25], kind: bifold, rooms: [bedroom_2]}
      - {id: d_bedroom_2, span: [25.5, 27.75], kind: door, rooms: [bedroom_2, hall_upper]}
    prov: inferred
    conf: low
    tol: 2
    src: "Jon 2026-11-08 plan review #2: enter bedroom_2 going north through the door at the top of the hook"
  - {id: w_up_b2_b3, level: upper, from: [28, 20], to: [37.5, 20], bearing: unknown, bearing_basis: "bedroom divider parallel to the center line; verify in attic", prov: inferred, conf: low, tol: 2, src: "Jon 2026-11-08 plan review #2"}
  # closets
  - id: w_up_closet_main_front
    level: upper
    from: [29, 9]
    to: [36, 9]
    bearing: "no"
    bearing_basis: "closet front"
    doors:
      - {id: d_closet_main, span: [29.5, 35.5], kind: bypass, rooms: [bedroom_main]}
    prov: inferred
    conf: medium
    tol: 2
    src: "Jon 2026-11-08: main bedroom closet on the wall shared with bedroom_3; J IMG_2496 bypass doors"
  - {id: w_up_closet_main_w, level: upper, from: [29, 9], to: [29, 11], bearing: "no", bearing_basis: "closet side", prov: inferred, conf: medium, tol: 2, src: "J IMG_2496"}
  - {id: w_up_closet_main_e, level: upper, from: [36, 9], to: [36, 11], bearing: "no", bearing_basis: "closet side", prov: inferred, conf: medium, tol: 2, src: "J IMG_2496"}
  - id: w_up_closet_b3_e
    level: upper
    from: [30.5, 15]
    to: [30.5, 20]
    bearing: "no"
    bearing_basis: "closet front"
    doors:
      - {id: d_closet_b3, span: [16, 18.5], kind: door, rooms: [bedroom_3]}
    prov: inferred
    conf: low
    tol: 2
    src: "J IMG_2498 (closet door beside the entry door); position a guess"
  - {id: w_up_closet_b3_s, level: upper, from: [28, 15], to: [30.5, 15], bearing: "no", bearing_basis: "closet side", prov: inferred, conf: low, tol: 2, src: "guess"}
  - {id: w_up_b2_left, level: upper, from: [23.25, 14.5], to: [23.25, 25.5], bearing: unknown, bearing_basis: "edge of the area Jon says isn't upper living space; what's behind it is an open question", prov: inferred, conf: low, tol: 2, src: "Jon 2026-11-08 plan review"}
  # lower
  - {id: w_low_bath_side, level: lower, from: [24, -0.5], to: [24, 6], bearing: unlikely, bearing_basis: "bath partition", prov: inferred, conf: low, tol: 2, src: "position guessed"}
  - id: w_low_bath_back
    level: lower
    from: [18.5, 6]
    to: [24, 6]
    bearing: unlikely
    bearing_basis: "bath partition"
    doors:
      - {id: d_bath_half, span: [19.5, 22], kind: bifold, rooms: [bath_half, family_room]}
    prov: inferred
    conf: low
    tol: 2
    src: "Jon 2026-11-08: louvered bifold off the family room is the half-bath door; J IMG_2484-2487"
  # basement
  - id: w_bsmt_bed4_front
    level: basement
    from: [5, 15]
    to: [17.5, 15]
    bearing: unlikely
    bearing_basis: "finished-room partition, likely added after construction; verify it isn't under the beam line"
    doors:
      - {id: d_bedroom_4, span: [9.5, 12], kind: door, rooms: [bedroom_4]}
    prov: inferred
    conf: low
    tol: 2
    src: "J IMG_2481-2482"
  - {id: w_bsmt_bed4_left, level: basement, from: [5, 15], to: [5, 23.5], bearing: "no", bearing_basis: "finished-room partition with a small interior window to the unfinished side", prov: inferred, conf: medium, tol: 2, src: "J IMG_2481"}

